site_name: ctf-toolkit
site_url: https://xaxa-0x3f.github.io/ctf-toolkit/
repo_url: https://github.com/xaxa-0x3F/ctf-toolkit
repo_name: xaxa-0x3F/ctf-toolkit
site_author: xaxa-0x3f
site_description: "A comprehensive cybersecurity toolkit for CTF competitions, including cheatsheets for Recon, Web Exploitation, Cryptography, Reverse Engineering, and Privilege Escalation."
copyright: "Copyright &copy; 2024 xaxa-0x3f"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xaxa-0x3F
  generator: false

theme:
  name: material
  palette:
    # Dark Mode (Default)
    - scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light Mode
    - scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/security

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Toolkit:
    - Reconnaissance & Enumeration: recon.md
    - Web Exploitation: web.md
    - Cryptography & Steganography: crypto.md
    - Forensics & Log Analysis: forensics.md
    - Reverse Engineering & Malware: reveng.md
    - Privilege Escalation & Shells: privesc.md
    - Password Cracking: passwords.md
    - Command Cheat Sheet: commands.md
  - Resources: resources.md